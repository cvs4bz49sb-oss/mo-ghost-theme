name: Podcast Top Episodes

# Rebuilds two files from the Buzzsprout JSON API:
#   assets/data/top-episodes.json       — "Most Listened" ranking per show
#   assets/data/scheduled-episodes.json — next scheduled episode per show
# Runs on a GitHub-hosted (non-Cloudflare) runner because Buzzsprout's
# Cloudflare WAF blocks Cloudflare Workers' egress IPs but not GitHub's. The
# mo-podcast-feed Worker reads the committed JSON from GitHub raw.
#
# Commits use [skip ci] so they don't trigger the theme deploy/lint workflows;
# the Worker reads the files from raw.githubusercontent.com, so no deploy needed.
#
# Scheduled episodes are time-sensitive (they go out in the weekly digest), so
# this runs every 6h. If you just scheduled an episode and want it now, trigger
# manually: gh workflow run "Podcast Top Episodes" --ref main

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, at :17
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: podcast-top-episodes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build podcast data (top + scheduled)
        env:
          BUZZSPROUT_API_TOKEN: ${{ secrets.BUZZSPROUT_API_TOKEN }}
        run: node scripts/build-top-episodes.mjs
      # Publishes to the `podcast-data` branch, NOT main.
      #
      # main is covered by the "main — TFR contributor gate" ruleset, which
      # requires a pull request and status checks and whose only bypass actor
      # is the admin repository role. GITHUB_TOKEN is not an admin, so every
      # run from 2026-07-31 onward died on "push declined due to repository
      # rule violations" and scheduled-episodes.json sat at all-nulls for two
      # weeks. Giving the Actions bot a bypass would have handed every
      # workflow write access to main, which is the opposite of what that
      # ruleset is for. The ruleset targets ~DEFAULT_BRANCH only, so a
      # dedicated data branch needs no exemption at all.
      #
      # mo-podcast-feed reads both files from raw.githubusercontent.com on
      # this branch. If you point it somewhere else, change it there too.
      - name: Publish podcast data to the data branch
        env:
          DATA_BRANCH: podcast-data
        run: |
          set -euo pipefail
          git config user.name "mo-bot"
          git config user.email "bot@users.noreply.github.com"

          if git diff --quiet -- assets/data/top-episodes.json assets/data/scheduled-episodes.json assets/data/podcast-totals.json; then
            echo "No change to podcast data."
            exit 0
          fi

          # Carry the freshly built files across the branch switch. Checking
          # out with them in the working tree risks a conflict once the data
          # branch has diverged from main.
          tmp="$(mktemp -d)"
          cp assets/data/top-episodes.json assets/data/scheduled-episodes.json assets/data/podcast-totals.json "$tmp/"

          # Discard everything else the build touched. The previous version
          # skipped this and its retry path died on "cannot pull with rebase:
          # You have unstaged changes" — a second bug hiding behind the first.
          git checkout -- . || true

          git fetch origin "$DATA_BRANCH" --depth=1 || true
          if git rev-parse --verify "origin/$DATA_BRANCH" >/dev/null 2>&1; then
            git checkout -B "$DATA_BRANCH" "origin/$DATA_BRANCH"
          else
            git checkout -B "$DATA_BRANCH"
          fi

          cp "$tmp/top-episodes.json" "$tmp/scheduled-episodes.json" "$tmp/podcast-totals.json" assets/data/

          if git diff --quiet -- assets/data/top-episodes.json assets/data/scheduled-episodes.json assets/data/podcast-totals.json; then
            echo "Data branch already current."
            exit 0
          fi

          git add assets/data/top-episodes.json assets/data/scheduled-episodes.json assets/data/podcast-totals.json
          git commit -m "Update podcast data (Most Listened + scheduled) [skip ci]"

          # Nothing else writes this branch and the concurrency group keeps
          # this workflow from racing itself, so a rejected push means the
          # branch moved for a reason worth failing loudly over.
          for attempt in 1 2 3; do
            if git push origin "$DATA_BRANCH"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected — rebasing onto origin/$DATA_BRANCH (attempt $attempt)."
            if ! git pull --rebase --autostash origin "$DATA_BRANCH"; then
              git rebase --abort || true
              echo "Rebase failed; leaving $DATA_BRANCH alone." >&2
              exit 1
            fi
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
