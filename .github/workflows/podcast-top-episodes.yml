name: Podcast Top Episodes

# Rebuilds two files from the Buzzsprout JSON API:
#   assets/data/top-episodes.json       — "Most Listened" ranking per show
#   assets/data/scheduled-episodes.json — next scheduled episode per show
# Runs on a GitHub-hosted (non-Cloudflare) runner because Buzzsprout's
# Cloudflare WAF blocks Cloudflare Workers' egress IPs but not GitHub's. The
# mo-podcast-feed Worker reads the committed JSON from GitHub raw.
#
# Commits use [skip ci] so they don't trigger the theme deploy/lint workflows;
# the Worker reads the files from raw.githubusercontent.com, so no deploy needed.
#
# Scheduled episodes are time-sensitive (they go out in the weekly digest), so
# this runs every 6h. If you just scheduled an episode and want it now, trigger
# manually: gh workflow run "Podcast Top Episodes" --ref main

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, at :17
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: podcast-top-episodes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build podcast data (top + scheduled)
        env:
          BUZZSPROUT_API_TOKEN: ${{ secrets.BUZZSPROUT_API_TOKEN }}
        run: node scripts/build-top-episodes.mjs
      - name: Commit if changed
        run: |
          git config user.name "mo-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet -- assets/data/top-episodes.json assets/data/scheduled-episodes.json; then
            echo "No change to podcast data."
            exit 0
          fi
          git add assets/data/top-episodes.json assets/data/scheduled-episodes.json
          git commit -m "Update podcast data (Most Listened + scheduled) [skip ci]"
          # The Buzzsprout fetch takes a minute or two, so main can move
          # underneath the run. A bare push then fails non-fast-forward and
          # the whole fetch is thrown away — which is what happened on
          # 2026-07-31 when a theme push landed mid-run. Rebase and retry.
          #
          # No merge strategy option here on purpose: the concurrency group
          # keeps this workflow from racing itself, so nothing else writes
          # these files, and a genuine conflict should fail loudly rather
          # than be resolved by a flag whose ours/theirs meaning inverts
          # under rebase. The next scheduled run regenerates either way.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected — rebasing onto origin/main (attempt $attempt)."
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "Rebase failed; leaving main alone." >&2
              exit 1
            fi
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
