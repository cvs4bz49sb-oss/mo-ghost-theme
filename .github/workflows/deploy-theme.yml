name: Deploy Ghost Theme

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# A merge to main and a Podcast Wiki refresh can both start a deploy. Run
# them one after the other so the later one always lands last.
concurrency:
  group: deploy-ghost-theme
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy theme to Ghost
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        # Pinned by commit SHA, not tag — moving tags are a supply-chain
        # risk per Codex audit 2026-05-11. v4 = 34e114876b0b...
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Check the Daily Liturgy data for markup
        # 2026-11-13 sent inline CSS ("--stroke-style: none;...") inside three
        # prayers to every Daily Liturgy subscriber. A bad data commit now
        # stops here instead of reaching the reader page and mo-kit's email.
        run: node scripts/check-liturgy-data.mjs

      - name: Use the podcast wiki index from the data branch
        # Podcast Wiki publishes assets/data/podcast-wiki.json to the
        # podcast-data branch (main is ruleset-protected). Ship that copy
        # when it parses, has both shows and is newer than main's; otherwise
        # keep main's copy so a bad data commit can't break the show pages.
        run: |
          set -uo pipefail
          FILE=assets/data/podcast-wiki.json
          if ! git fetch --depth=1 origin podcast-data; then
            echo "No podcast-data branch; keeping main's $FILE."
            exit 0
          fi
          if ! git show "FETCH_HEAD:$FILE" > "$RUNNER_TEMP/wiki.json" 2>/dev/null; then
            echo "podcast-data has no $FILE; keeping main's copy."
            exit 0
          fi
          node - "$RUNNER_TEMP/wiki.json" "$FILE" <<'JSEOF'
          const fs = require("fs");
          const [candidate, current] = process.argv.slice(2);
          const SHOWS = ["christians-reading-classics", "mere-fidelity"];
          const newest = (d) => Math.max(...SHOWS.map((s) => Date.parse(d[s].updated) || 0));
          let next;
          try {
            next = JSON.parse(fs.readFileSync(candidate, "utf8"));
            for (const s of SHOWS) {
              if (!Array.isArray(next[s]?.episodes) || next[s].episodes.length === 0) {
                throw new Error(`${s} has no episodes`);
              }
            }
          } catch (e) {
            console.log(`Data-branch index rejected (${e.message}); keeping main's copy.`);
            process.exit(0);
          }
          let mainStamp = 0;
          try { mainStamp = newest(JSON.parse(fs.readFileSync(current, "utf8"))); } catch {}
          if (newest(next) <= mainStamp) {
            console.log("main's index is as new as the data branch's; keeping it.");
            process.exit(0);
          }
          fs.copyFileSync(candidate, current);
          const counts = SHOWS.map((s) => `${s} ${next[s].episodes.length}`).join(", ");
          console.log(`Using the data-branch index (${counts}).`);
          JSEOF

      - name: Deploy theme
        # Pinned by commit SHA, not tag — moving tags are a supply-chain
        # risk per Codex audit 2026-05-11. v1.6.6 = a0ee1147d156...
        uses: TryGhost/action-deploy-theme@a0ee1147d15641db25681e54549c4db9a53c2629  # v1.6.6
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}

      - name: Activate theme via Admin API
        # The deploy action uploads but does not activate, so the CDN
        # hash never rotates and browsers keep serving stale CSS.
        # This step calls PUT /themes/mere-orthodoxy/activate directly,
        # which rotates the ?v= hash and busts Ghost Pro's CDN cache.
        run: |
          python3 - <<'PYEOF'
          import base64, hashlib, hmac, json, time, urllib.request, os, sys

          key      = os.environ['GHOST_ADMIN_API_KEY']
          base_url = os.environ['GHOST_ADMIN_API_URL'].rstrip('/')
          id_, secret = key.split(':', 1)

          now = int(time.time())
          def b64u(data):
              return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

          header  = b64u(json.dumps({'alg':'HS256','kid':id_,'typ':'JWT'}).encode())
          payload = b64u(json.dumps({'iat':now,'exp':now+300,'aud':'/admin/'}).encode())
          sig     = b64u(hmac.new(bytes.fromhex(secret),
                                  f'{header}.{payload}'.encode(),
                                  hashlib.sha256).digest())
          jwt = f'{header}.{payload}.{sig}'

          url = f'{base_url}/ghost/api/admin/themes/mere-orthodoxy/activate'
          req = urllib.request.Request(
              url, method='PUT',
              headers={'Authorization': f'Ghost {jwt}',
                       'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f'Activated — HTTP {resp.status}')
          except urllib.error.HTTPError as e:
              print(f'HTTP {e.code}: {e.read().decode()}', file=sys.stderr)
              sys.exit(1)
          PYEOF
        env:
          GHOST_ADMIN_API_URL: ${{ secrets.GHOST_ADMIN_API_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
