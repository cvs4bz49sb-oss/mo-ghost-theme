name: Daily Liturgy band go-live

# One-shot scheduled restore of the homepage Daily Liturgy band.
#
# The band was pulled from index.hbs on 27 Jul 2026 in commit 66b4c44.
# This workflow reverts that commit and redeploys, putting the section
# back on the homepage.
#
# WHY THE DEPLOY IS INLINE HERE rather than left to deploy-theme.yml:
# a push made with the built-in GITHUB_TOKEN deliberately does NOT
# trigger other workflows, so deploy-theme.yml would never fire on the
# revert push. The deploy + activate steps below are copied from it.
#
# TIMING: cron is UTC. On 3 Aug 2026 US Central is on CDT (UTC-5), so
# 10:02 UTC is 05:02 America/Chicago. GitHub's scheduled runners are
# routinely 5-15 minutes late under load, so treat 05:00 as a floor,
# not an exact moment. It will never fire early.
#
# AFTER IT RUNS: delete this file. The cron would otherwise match again
# on 3 Aug 2027; the guard step below makes that a no-op, but the
# workflow has served its purpose.

on:
  schedule:
    - cron: "2 10 3 8 *"   # 3 Aug, 10:02 UTC = 05:02 America/Chicago (CDT)
  workflow_dispatch: {}    # manual trigger, for testing or an early launch

permissions:
  contents: write

concurrency:
  group: dlp-band-golive
  cancel-in-progress: false

env:
  REMOVAL_SHA: 66b4c44bace2d4fc55ad9736dafdb58aaa0d6f86

jobs:
  golive:
    name: Restore the Daily Liturgy band and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        # Pinned by commit SHA, not tag — moving tags are a supply-chain
        # risk per Codex audit 2026-05-11. v4 = 34e114876b0b...
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0   # full history — the revert needs the removal commit

      - name: Skip if the band is already back
        id: guard
        run: |
          if grep -q 'class="dlp-band"' index.hbs; then
            echo "Band is already present in index.hbs — nothing to do."
            echo "restore=false" >> "$GITHUB_OUTPUT"
          else
            echo "restore=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Revert the removal commit
        if: steps.guard.outputs.restore == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit "$REMOVAL_SHA"
          # Fail loudly rather than deploying a half-restored homepage.
          grep -q 'class="dlp-band"' index.hbs
          grep -q 'data-dlp-band' index.hbs
          git push origin HEAD:main

      - name: Deploy theme
        if: steps.guard.outputs.restore == 'true'
        # Pinned by commit SHA, not tag — moving tags are a supply-chain
        # risk per Codex audit 2026-05-11. v1.6.6 = a0ee1147d156...
        uses: TryGhost/action-deploy-theme@a0ee1147d15641db25681e54549c4db9a53c2629  # v1.6.6
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}

      - name: Activate theme via Admin API
        if: steps.guard.outputs.restore == 'true'
        # The deploy action uploads but does not activate, so the CDN
        # hash never rotates and browsers keep serving stale CSS.
        run: |
          python3 - <<'PYEOF'
          import base64, hashlib, hmac, json, time, urllib.request, os, sys

          key      = os.environ['GHOST_ADMIN_API_KEY']
          base_url = os.environ['GHOST_ADMIN_API_URL'].rstrip('/')
          id_, secret = key.split(':', 1)

          now = int(time.time())
          def b64u(data):
              return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

          header  = b64u(json.dumps({'alg':'HS256','kid':id_,'typ':'JWT'}).encode())
          payload = b64u(json.dumps({'iat':now,'exp':now+300,'aud':'/admin/'}).encode())
          sig     = b64u(hmac.new(bytes.fromhex(secret),
                                  f'{header}.{payload}'.encode(),
                                  hashlib.sha256).digest())
          jwt = f'{header}.{payload}.{sig}'

          url = f'{base_url}/ghost/api/admin/themes/mere-orthodoxy/activate'
          req = urllib.request.Request(
              url, method='PUT',
              headers={'Authorization': f'Ghost {jwt}',
                       'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f'Activated — HTTP {resp.status}')
          except urllib.error.HTTPError as e:
              print(f'HTTP {e.code}: {e.read().decode()}', file=sys.stderr)
              sys.exit(1)
          PYEOF
        env:
          GHOST_ADMIN_API_URL: ${{ secrets.GHOST_ADMIN_API_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
