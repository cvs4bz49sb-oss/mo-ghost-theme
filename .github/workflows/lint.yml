name: Security Regression Lint

# Runs ESLint with the security-focused ruleset in eslint.config.mjs
# on every push and PR. Fails the build if any rule fires.
#
# Rules pinned today:
#   - No `?email=` in URL/template literals (audit C3 regression guard)
#   - No `window.MOAdminAuth` references (removed in D1; use MOAuth.fetch)
#   - No direct `window.location` assignment (use MOSafeRedirect.go)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Verify digest JSX outputs are up to date
        run: npm run build:digest:check
      - name: Verify built CSS/JS are up to date
        # Ghost serves the .min files, so a stale one silently ships the
        # wrong styles (2026-07-15 incident). This was documented as a CI
        # check for a year but never actually wired up. It matters more
        # now: assets/css/faith-received.css is editable by outside TFR
        # contributors, and a PR that edits the source without running
        # `npm run build` would otherwise merge green and deploy stale.
        run: npm run build:check
      - name: Verify no reader inflates a body that is not gzipped
        # 2026-09-11: every one of the 15,569 Early English Books works
        # was unreadable because gunzip() piped a body through
        # DecompressionStream regardless of what was in it. The library
        # serves these .json.gz keys with `content-encoding: br`, the
        # browser decodes the transport layer, and inflating the result
        # throws. The page blamed the reader's ad blocker.
        #
        # The same mistake had already appeared in
        # build-scripture-index.mjs and been written around in
        # lib/locus-text.js, so it is a class of bug rather than a slip.
        # This asserts both halves: every DecompressionStream caller
        # sniffs the gzip magic first, and real endpoints still parse.
        run: npm run check:gz

      - name: Verify no page script reaches for an element the page lacks
        # 2026-09-21: the search page's own nav bar was removed in favour
        # of the shared rail, and the line that bound its Theme button
        # stayed behind. Unguarded and at the top level of the file, it
        # threw before anything below it ran, so the mode tabs, the
        # Search button and the results list were never wired. Every tab
        # on /the-faith-received/search/ was dead for a day while the
        # page looked entirely normal.
        #
        # Deleting markup is the half that gets remembered. This checks
        # the other half.
        run: node scripts/check-page-dom-contract.mjs

      - name: Verify Daily Liturgy Scripture references parse
        # A hand-entered reading the parser can't read renders as
        # "Could not parse reference" on /daily-liturgy/read/ and
        # "Could not resolve" in the emailed liturgy, one day at a time,
        # with nothing to notice until a subscriber writes in.
        run: npm run check:refs

      - name: Verify slide-in measurement
        # The numbers on /admin/slide-ins/ depend on slide-in.js sending a
        # beacon for each show, click and close, and on its button link
        # carrying ?slide-in=<id> so a checkout can be credited to it. None
        # of that is visible on the page, so a refactor that drops it would
        # leave every count quietly at zero.
        run: npm run check:slide-ins
