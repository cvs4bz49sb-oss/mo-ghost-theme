# Ghost routing for Mere Orthodoxy.
#
# Ghost treats routes.yaml as site config, not theme content, so it is
# NOT included in theme deploys (the GitHub Action zips exclude it).
# To apply this file: Ghost Admin -> Settings -> Labs -> Routes ->
# Upload routes file, then pick this file. Only needs to happen when
# routes change.

routes:
  /membership/:
    template: custom-membership
  /offer/:
    template: custom-offer
  /kirk-offer/:
    template: custom-kirk-offer
  /contributors/:
    template: custom-contributors
  /contributors/all/:
    template: custom-all-contributors
  /about/:
    template: custom-about
  /archive/:
    controller: channel
    template: custom-archive
    filter: status:published
  # More specific path first. /give/ is the chooser and sends 1-to-12
  # month gifts to Ghost's native Portal gift flow; /give/lifetime/ is
  # the one gift Portal cannot sell, so it keeps the custom
  # mo-membership checkout.
  /give/lifetime/:
    template: custom-gift-lifetime
  /give/:
    template: custom-gift
  /donate/:
    template: custom-donate
  /groups/:
    template: custom-groups
  /group-manage/:
    template: custom-group-manage
  /institutions/:
    template: custom-institutions
  /institutions/checkout/:
    template: custom-institution-checkout
  /institutions/guide/:
    template: custom-institution-guide
  /institution-manage/:
    template: custom-institution-manage
  /join/:
    template: custom-institution-join
  /manage/:
    template: custom-manage
  /migrate/:
    template: custom-migrate
  /student/:
    template: custom-student
  /complete-membership/:
    template: custom-complete-membership
  /dashboard/:
    template: custom-dashboard
  /dashboard/bookmarks/:
    template: custom-dashboard-bookmarks
  # Works saved from the library, kept in the same bookmark store under
  # "tfr:" ids and resolved against the catalogues client-side.
  /dashboard/faith-received/:
    template: custom-dashboard-faith-received
  /dashboard/commonplace/:
    template: custom-dashboard-commonplace
  /dashboard/history/:
    template: custom-dashboard-history
  /dashboard/institution/:
    template: custom-dashboard-institution
  /dashboard/replays/:
    template: custom-dashboard-replays
  /dashboard/ebooks/:
    template: custom-dashboard-ebooks
  /dashboard/prayer/:
    template: custom-dashboard-prayer
  /events/:
    template: custom-events
  /forum/:
    template: custom-forum
  /success/:
    template: custom-success
  /sponsorship/:
    template: custom-sponsorship
  /contact/:
    template: custom-contact
  /privacy/:
    template: custom-privacy
  /books/:
    template: custom-bookstore
  # Storefront for physical goods (back issues of the print journal).
  # Checkout is a Stripe Payment Link; the live "copies left" counter
  # is the mo-store Worker (website/workers/store/). Distinct from
  # /books/, which is affiliate recommendations, not our inventory.
  /store/:
    template: custom-store
  /submissions/:
    template: custom-submissions
  # New Writers Meetings - three Zoom conversations, Sep/Oct/Nov 2026.
  # LIVE as of 2026-08-10. The mo-forms worker is deployed and its
  # /writers-meetings endpoint answers, so the form works. Two config
  # items are still open in website/workers/forms/wrangler.toml (they are
  # non-secret [vars] there, not `wrangler secret put` - a deploy
  # overwrites dashboard vars with the toml block):
  #   WRITERS_MEETINGS_TO   still empty, so RSVPs fall back to
  #     SUBMISSIONS_TO (submissions@). Set it to Nadya's address and
  #     redeploy the worker.
  #   WRITERS_MEETINGS_GFORM_URL / _ENTRIES  still empty, so the
  #     spreadsheet copy is skipped and only the email sends.
  /writers-meetings/:
    template: custom-writers-meetings
  /podcasts/mere-fidelity/:
    template: custom-mere-fidelity
  /podcasts/christians-reading-classics/:
    template: custom-christians-reading-classics
  /podcasts/passages-nicaea/:
    template: custom-passages-nicaea
  /daily-liturgy/:
    template: custom-daily-liturgy
  /daily-liturgy/read/:
    template: custom-daily-liturgy-reader
  /admin/:
    template: custom-admin
  /admin/members/:
    template: custom-admin-members
  /admin/members/cancellations/:
    template: custom-admin-cancellations
  /admin/members/journeys/:
    template: custom-admin-journeys
  /admin/members/addresses/:
    template: custom-admin-addresses
  /admin/members/gifts/:
    template: custom-admin-gifts
  /admin/members/groups/:
    template: custom-admin-groups
  /admin/members/institutions/:
    template: custom-admin-institutions
  /admin/members/institutions/manage/:
    template: custom-admin-institution
  /admin/members/students/:
    template: custom-admin-students
  /admin/members/referrals/:
    template: custom-admin-referrals
  /admin/members/influencers/:
    template: custom-admin-influencers
  /admin/members/drift/:
    template: custom-admin-drift
  # Store orders, read live from Stripe by the mo-store Worker. Needs
  # @custom.store_worker_url set, and mo-store needs GHOST_ADMIN_API_KEY
  # for the staff check or every request 403s.
  /admin/orders/:
    template: custom-admin-orders
  /admin/content/:
    template: custom-admin-content
  /admin/agenda/:
    template: custom-admin-agenda
  /admin/settings/:
    template: custom-admin-settings
  /admin/slide-ins/:
    template: custom-admin-slide-ins
  /admin/engagement/:
    template: custom-admin-engagement
  /admin/heatmap/:
    template: custom-admin-heatmap
  /admin/kpi/:
    template: custom-admin-kpi
  /admin/audience/:
    template: custom-admin-audience
  /welcome/:
    template: custom-welcome
  /admin/tfr/:
    template: custom-admin-tfr
  # Reader survey results. Its own page and its own admin grant
  # ("tfr-survey"); /admin/tfr/ next door carries reader PII and
  # this does not, so the two are grantable apart.
  /admin/tfr-survey/:
    template: custom-admin-tfr-survey
  /admin/migration/:
    template: custom-admin-migration
  /admin/editorial/:
    template: custom-admin-editorial
  /admin/inbox/:
    template: custom-admin-inbox
  /admin/contact/:
    template: custom-admin-contact
  /admin/coverage/:
    template: custom-admin-coverage
  /admin/articles/:
    template: custom-admin-articles
  /admin/social/:
    template: custom-admin-social
  /admin/liturgy/:
    template: custom-admin-liturgy
  /admin/emails/:
    template: custom-admin-emails
  /admin/assets/:
    template: custom-admin-assets
  /admin/copy/:
    template: custom-admin-copy
  /admin/extract/:
    template: custom-admin-extract
  /admin/sponsors/:
    template: custom-admin-sponsors
  /admin/podcasts/:
    template: custom-admin-podcasts
  # Forum registrations. Distinct from the public /events/ library.
  /admin/events/:
    template: custom-admin-events
  /digest-gen/:
    template: custom-digest-gen
  # Public ebook catalog. Anonymous-viewable; tiles route through
  # the per-ebook landing pages.
  /ebooks/:
    template: custom-ebooks
  # Ebook landing pages (public, lead-gen). Form on each posts to
  # mo-ebook-access /grant which writes attribution labels and sends
  # a Ghost magic link.
  /ebook/navigating-the-fracture/:
    template: custom-ebook-navigating-the-fracture
  /ebook/spiritual-formation-for-the-family/:
    template: custom-ebook-spiritual-formation-for-the-family
  /ebook/ai-and-the-church/:
    template: custom-ebook-ai-and-the-church
  /ebook/formation/:
    template: custom-ebook-formation
  # Ebook read pages - direct template binding (no Ghost Page record).
  # Member gating is inline at the top of each template via {{#if @member}}.
  /ebook/navigating-the-fracture/read/:
    template: page-ebook-navigating-the-fracture-read
  /ebook/spiritual-formation-for-the-family/read/:
    template: page-ebook-spiritual-formation-for-the-family-read
  /ebook/ai-and-the-church/read/:
    template: page-ebook-ai-and-the-church-read
  /ebook/formation/read/:
    template: page-ebook-formation-read
  # Journal archive - digital editions of the print journal.
  # Library page (reuses ebook grid layout) + per-issue PDF readers.
  /dashboard/journals/:
    template: custom-dashboard-journals
  /journal-archive/issue-01/:
    template: page-journal-issue-01-read
  /journal-archive/issue-02/:
    template: page-journal-issue-02-read
  /journal-archive/issue-03/:
    template: page-journal-issue-03-read
  /journal-archive/issue-04/:
    template: page-journal-issue-04-read
  /journal-archive/issue-05/:
    template: page-journal-issue-05-read
  /journal-archive/issue-06/:
    template: page-journal-issue-06-read
  /journal-archive/issue-07/:
    template: page-journal-issue-07-read
  /journal-archive/issue-08/:
    template: page-journal-issue-08-read
  /journal-archive/issue-09/:
    template: page-journal-issue-09-read
  /journal-archive/issue-10/:
    template: page-journal-issue-10-read
  # Blueprint for Renewal - HIDDEN as of 2026-04-25. Editorial work
  # in progress. Re-enable by uncommenting these two routes (and
  # restoring the catalog tile in custom-ebooks.hbs and the dashboard
  # tile in partials/ebooks-list.hbs). The .hbs files stay in place.
  # /ebook/blueprint-for-renewal/:
  #   template: custom-ebook-blueprint-for-renewal
  # /ebook/blueprint-for-renewal/read/:
  #   template: page-ebook-blueprint-for-renewal-read

  # -- Bible ------------------------------------------------------
  # Scripture reader. Proxies api.bible through the mo-bible Cloudflare
  # Worker; cross-references to The Faith Received are read from the
  # static scripture-index.json bundled by the TFR build script. URL
  # state is encoded in the hash (#JHN.1 etc.) - single template, no
  # subroutes required.
  /bible/:
    template: custom-bible

  # -- The Faith Received -----------------------------------------
  # Project home + 22 historic-document subpages + 5 feature pages.
  # Per-document wrapper templates are auto-generated by
  # scripts/build-faith-received.mjs from JSON sources in
  # data/faith-received/. To add or remove a document:
  #   1. add/remove the entry in scripts/import-faith-received.mjs
  #   2. re-run `node scripts/import-faith-received.mjs`
  #      then `node scripts/build-faith-received.mjs`
  #   3. add or remove the matching block below
  # See memory/ghost-theme.md for the full operational guide.
  /the-faith-received/:
    template: custom-the-faith-received
  # The landing stopped being a tab shell on 2026-08-20: browsing moved
  # to its own route below, and topics, scripture, today and devotional
  # were already routed separately further down this file, so nothing
  # was orphaned by the change. See website/handoffs/TFR-REDESIGN.md.
  /the-faith-received/fathers/:
    template: custom-faith-author
  /the-faith-received/fathers/reading-guides/:
    template: custom-faith-fathers
  /the-faith-received/all-works/:
    template: custom-faith-centuries
  # Works with page scans (2026-09-24): All Works with ?scans=1 fixed on.
  /the-faith-received/scans/:
    template: custom-faith-scans
  /the-faith-received/century/:
    template: custom-faith-centuries
  # /centuries/ added 2026-09-21 at Ian's request. The page already
  # answered to three names and not to its own plural, which is the one
  # a reader is most likely to type and the one the template is named
  # for; it was the only TFR path of the twenty probed that 404'd.
  /the-faith-received/centuries/:
    template: custom-faith-centuries
  # /library/ was the ported landing (custom-faith-port-index, built from
  # LANDING-PAGE-SPEC.md). Retired 2026-09-15: its two useful parts,
  # Continue reading and Browse the shelves, now sit at the top of All
  # Works, which already had the search, the facets and the A-Z. Every
  # link that pointed here points at /all-works/ now, and the route stays
  # so an old bookmark lands on the same page rather than a 404.
  /the-faith-received/library/:
    template: custom-faith-centuries
  # The Curated page (was /browse/; Ian, 2026-09-24: "Change the URL of this
  # page to /curated"). Every link in the theme points here. /browse/ stays
  # as a route so an old link still lands on the page if the redirect below
  # (redirects.yaml, uploaded separately) is not in place; with it in place
  # the redirect answers first.
  /the-faith-received/curated/:
    template: custom-faith-browse
  /the-faith-received/browse/:
    template: custom-faith-browse
  # The research desk, ported from the corpus owner's own site (2026-09-10)
  # and rebuilt on our backend and design. Compare sets two to four authors
  # side by side on one topic, oldest first, so a topic reads as a reception
  # history. Pins groups kept passages into named collections; it stores only
  # the grouping, since faith-notebook-store.js owns the passages themselves.
  # Desk is where a paper gets written out of them.
  /the-faith-received/compare/:
    template: custom-faith-port-compare
  /the-faith-received/pins/:
    template: custom-faith-port-pins
  # /desk/ is the corpus site's writing desk, ported (custom-faith-port-desk).
  # It was a redirect into /research/#desk, kept for ?doc=<id> links; the
  # ported page reads ?doc= itself, so those links still open their paper.
  # The redirect template, custom-faith-desk.hbs, stays in the tree.
  /the-faith-received/desk/:
    template: custom-faith-port-desk
  # One route for all eight reading rooms; ?collection= picks which.
  # A page per collection. The shared /room/ route stays as a fallback
  # for links that still carry ?collection=.
  /the-faith-received/latin-library/:
    template: custom-faith-room-latin-library
  /the-faith-received/early-english-books/:
    template: custom-faith-room-early-english-books
  /the-faith-received/patrologia-latina/:
    template: custom-faith-room-patrologia-latina
  /the-faith-received/patrologia-graeca/:
    template: custom-faith-room-patrologia-graeca
  /the-faith-received/patrologia-orientalis/:
    template: custom-faith-room-patrologia-orientalis
  /the-faith-received/augustine/:
    template: custom-faith-room-augustine
  /the-faith-received/confessions/:
    template: custom-faith-room-confessions
  /the-faith-received/room/:
    template: custom-faith-room
  # Schools & parties - finer than the nine top-level traditions, from
  # the 2026-09 mo-tfr data drop (v1/schools.json + the `party` field
  # on v1/works-index.json). See assets/js/faith-shelves.js and
  # website/sessions/2026-09-03-mo-tfr-bucket-audit.md.
  /the-faith-received/puritans/:
    template: custom-faith-shelf-puritans
  /the-faith-received/anglicans/:
    template: custom-faith-shelf-anglicans
  /the-faith-received/methodists/:
    template: custom-faith-shelf-methodists
  /the-faith-received/westminster-assembly/:
    template: custom-faith-shelf-westminster-assembly
  /the-faith-received/jesuits/:
    template: custom-faith-shelf-jesuits
  /the-faith-received/franciscans/:
    template: custom-faith-shelf-franciscans
  /the-faith-received/dominicans/:
    template: custom-faith-shelf-dominicans
  /the-faith-received/augustinians/:
    template: custom-faith-shelf-augustinians
  # One page per author, keyed by ?a=<folded-name>. Rendered at read
  # time: there are 14,000+ names across the seven collections.
  /the-faith-received/authors/:
    template: custom-faith-author
  /the-faith-received/dtc/:
    template: custom-faith-dictionary
  /the-faith-received/english-editions/:
    template: custom-faith-room-english-editions
  /the-faith-received/topics/reading-guides/:
    template: custom-faith-topics
  /the-faith-received/author/:
    template: custom-faith-author
  # One page per tradition, keyed by ?t=<slug>; without ?t= it is the
  # index of traditions (Ian, 2026-09-24). The Confessions page's
  # "About <tradition>" links land here. /traditions/ is the plural a
  # reader types. custom-faith-tradition.hbs + page/faith-tradition.js.
  /the-faith-received/tradition/:
    template: custom-faith-tradition
  /the-faith-received/traditions/:
    template: custom-faith-tradition
  # Guides to the shelves (theme #128, 2026-10-10): one guide per shelf at
  # ?s=<shelf>, the century ruler without it. Links into the guides stay
  # hidden until this route answers (faith-guide-links.js).
  /the-faith-received/guide/:
    template: custom-faith-guide
  # Feature pages
  /the-faith-received/transparency/:
    template: custom-faith-transparency
  # What the project is, why it exists, and how the texts were made.
  # Ian's text, 2026-09-22. Linked from the TFR homepage hero.
  /the-faith-received/manifesto/:
    template: custom-faith-manifesto
  # The guided tours' hub (Ian, 2026-09-25): five cards, each starting a
  # tour on its demo page with ?tour=<name>. See custom-faith-tutorial.hbs
  # and assets/js/page/faith-tour.js.
  /the-faith-received/tutorial/:
    template: custom-faith-tutorial
  # The Resources page (2026-10-20, #193 to #203): Mere Orthodoxy articles and podcasts. The rail links here;
  # Ghost Admin has had this route since 10-20, the repo file did not.
  /the-faith-received/resources/:
    template: custom-faith-resources
  # How to use (Ian, 2026-10-23): one page, three tabs (Laity, Pastors, Academics), each a short list of features with a screenshot.
  # Deep links: #laity, #pastors, #academics. See custom-faith-how-to-use.hbs.
  /the-faith-received/how-to-use/:
    template: custom-faith-how-to-use
  /the-faith-received/search/:
    template: custom-faith-port-search
  # A question answered from the library with citations - POSTs to
  # mo-tfr-library's /v1/ask. See website/workers/tfr-library/lib/ask.js.
  /the-faith-received/ask/:
    template: custom-faith-ask-workspace
  # The Ask WORKSPACE (2026-09-14): the corpus owner's engine in our
  # skin - a conversation with a history rail, the citation chips that
  # open the page they came from, and a source pane beside the thread.
  # See custom-faith-ask-workspace.hbs.
  #
  # PROMOTED 2026-09-14: /ask/ above now serves the workspace, because
  # that is the path everything on the site already points at and the
  # one a reader lands on. This entry stays as an alias so the links
  # handed out while it was provisional keep working; it renders the
  # same template and can be dropped whenever.
  /the-faith-received/ask-workspace/:
    template: custom-faith-ask-workspace
  # The research desk - one page, five workspaces behind a tab strip:
  # Ask (the same shared partial /ask/ renders), Power Search (semantic
  # search over the corpus, GET /v1/vsearch on mo-tfr-library), and
  # Bookmarks / Notebook / Constellations, which are still being built.
  # Deep-linkable per workspace: #ask, #power-search, #bookmarks,
  # #notebook, #constellations.
  /the-faith-received/research/:
    template: custom-faith-research
  # The Scripture reader and Verse Desk (Ian, 2026-09-22: the rebuild
  # replaced the old Scripture Index and the ported Bible). One route
  # serves every verse: ?ref=<book>.<c>.<v>. The reader also reads the
  # old Index's ?book=&chapter= and #ref- addresses.
  /the-faith-received/scripture/:
    template: custom-scripture-dev
  /the-faith-received/scripture/desk/:
    template: custom-scripture-dev-desk
  # The ported Bible's address, kept because links across the site still
  # build it (#b/<book>/<c>?v=); it forwards to the Scripture reader.
  /the-faith-received/bible/:
    template: custom-faith-bible-forward
  # The citation atlas, ported: every author a point placed by time, every
  # recorded citation an edge, with the passages behind each connection.
  # Hash-routed: #a=<author> dossier, #t=<topic>, #v=<book>/<ch>, #shelves=.
  /the-faith-received/connections/:
    template: custom-faith-port-web
  # Two former addresses for the same page, kept so shared links live.
  # /web/ was the original; /constellations/ was its name for a few hours
  # on 2026-09-21 before Ian settled on Connections.
  /the-faith-received/constellations/:
    template: custom-faith-port-web
  # The controversies (2026-10-21): two authorities question by question, as the library's own controversy literature argued
  # them (Rada: Thomas and Scotus; Capreolus: Thomas and his critics; Turretin and his opponents), each side in his own words.
  /the-faith-received/controversies/:
    template: custom-faith-controversies
  # Maps of the tradition (2026-10-21): for each classic question the positions, every author placed by century and tradition,
  # the lines between them, the axes and the turning points.
  /the-faith-received/maps/:
    template: custom-faith-maps
  # The atlas was at /web/ until 2026-09-21. Ian renamed it to match what
  # the rail calls it. The old address stays, pointing at the same
  # template, so links already shared keep working.
  /the-faith-received/web/:
    template: custom-faith-port-web
  /the-faith-received/today/:
    template: custom-faith-today
  /the-faith-received/glossary/:
    template: custom-faith-glossary
  # v1/dtc/ (mo-tfr) -- the Dictionnaire de Theologie Catholique, a real
  # French theological encyclopedia. Browse and article view share one
  # route: ?e=<letter>/<slug>.json opens an entry directly, same pattern
  # as /the-faith-received/glossary/?q=.
  /the-faith-received/dictionary/:
    template: custom-faith-dictionary
  # The free-inference tools (2026-10-20), as The Faith Received has them: the commented texts
  # place by place (#sentences/1/3, #summa/I-II/109, #decretals/1/29, #decretum/C/12), the
  # classic disputed questions with each author's answer (#q040), the lexicon of terms as the
  # authors define them (#gratia), and one index for a whole set of volumes (?set=pl).
  /the-faith-received/commentary-decks/:
    template: custom-faith-decks
  /the-faith-received/disputed-questions/:
    template: custom-faith-atlas
  /the-faith-received/lexicon/:
    template: custom-faith-lexicon
  /the-faith-received/set-index/:
    template: custom-faith-set-index
  # Shared questions (2026-10-22): the questions three or more works of the library ask, by topic and part, each with every work
  # and page that asks it; the part's askers by century and tradition, and a disputed question's positions. #<topic>/<part>/<n>.
  /the-faith-received/shared-questions/:
    template: custom-faith-questions
  # The full ~190-topic layer (v1/mine/topic2-all/) underneath the 13
  # curated topic pages below. One route, two states via ?s=<slug>  - 
  # same pattern as /the-faith-received/author/?a=.
  /the-faith-received/doctrines/:
    template: custom-faith-doctrines
  # Topics rebuilt as a systematic theology from the primary sources
  # (Ian, 2026-09-22); replaced the ported Topics index the same day.
  # One route: ?t=<locus id> opens a locus, &c= and &view= pick the tabs.
  # Old #<topic slug> links resolve to their locus.
  /the-faith-received/topics/:
    template: custom-faith-topics-dev
  /the-faith-received/topics/god-and-trinity/:
    template: custom-faith-topic-god-and-trinity
  /the-faith-received/topics/scripture-and-revelation/:
    template: custom-faith-topic-scripture-and-revelation
  /the-faith-received/topics/creation-and-providence/:
    template: custom-faith-topic-creation-and-providence
  /the-faith-received/topics/sin-and-the-fall/:
    template: custom-faith-topic-sin-and-the-fall
  /the-faith-received/topics/christ-and-the-incarnation/:
    template: custom-faith-topic-christ-and-the-incarnation
  /the-faith-received/topics/salvation-and-justification/:
    template: custom-faith-topic-salvation-and-justification
  /the-faith-received/topics/the-holy-spirit/:
    template: custom-faith-topic-the-holy-spirit
  /the-faith-received/topics/the-church/:
    template: custom-faith-topic-the-church
  /the-faith-received/topics/sacraments-and-ordinances/:
    template: custom-faith-topic-sacraments-and-ordinances
  /the-faith-received/topics/the-christian-life/:
