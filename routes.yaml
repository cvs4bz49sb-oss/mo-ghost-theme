  # Dynamic reader for the Latin library (503 early modern theology
  # works). Content is fetched from R2 via the mo-tfr-library Worker.
  /the-faith-received/reader/:
    template: custom-faith-reader
  # The ported page-native reader, side by side with the one above
  # rather than in place of it (READER-SPEC 0 asks for a replacement;
  # this is the trial that decides whether it earns one). Nothing links
  # here. /reader/ is untouched and is still what every link on the site
  # opens, so a reader cannot land on this by accident.
  #
  # The gate is scripts/reader-acceptance.js, which was written against
  # the five bugs fixed on 2026-09-11 and asserts on the rendered page
  # rather than on our code, so it runs against either reader unchanged.
  # It is green on /reader/ today. When it is green here too, this
  # becomes the route /reader/ points at - and not before.
  /the-faith-received/review/:
    template: custom-faith-port-read
  /the-faith-received/readen/:
    template: custom-faith-port-readen
  /the-faith-received/read/:
    template: custom-faith-port-read

collections:
  /transcripts/:
    permalink: /transcripts/{slug}/
    filter: tag:hash-podcast-transcript
  # Event posts are excluded from the main collection so they don't
  # appear in the editorial feed. This collection gives them a permalink
  # so their individual post pages are reachable (e.g. from /events/).
  /event-posts/:
    permalink: /{slug}/
    filter: tag:hash-event
  /:
    permalink: /{slug}/
    template: index
    filter: tag:-hash-event+tag:-hash-podcast-transcript

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
