  /journal-archive/issue-09/:
    template: page-journal-issue-09-read
  # Blueprint for Renewal — HIDDEN as of 2026-04-25. Editorial work
  # in progress. Re-enable by uncommenting these two routes (and
  # restoring the catalog tile in custom-ebooks.hbs and the dashboard
  # tile in partials/ebooks-list.hbs). The .hbs files stay in place.
  # /ebook/blueprint-for-renewal/:
  #   template: custom-ebook-blueprint-for-renewal
  # /ebook/blueprint-for-renewal/read/:
  #   template: page-ebook-blueprint-for-renewal-read

  # ── Bible ──────────────────────────────────────────────────────
  # Scripture reader. Proxies api.bible through the mo-bible Cloudflare
  # Worker; cross-references to The Faith Received are read from the
  # static scripture-index.json bundled by the TFR build script. URL
  # state is encoded in the hash (#JHN.1 etc.) — single template, no
  # subroutes required.
  /bible/:
    template: custom-bible

  # ── The Faith Received ─────────────────────────────────────────
  # Project home + 22 historic-document subpages + 5 feature pages.
  # Per-document wrapper templates are auto-generated by
  # scripts/build-faith-received.mjs from JSON sources in
  # data/faith-received/. To add or remove a document:
  #   1. add/remove the entry in scripts/import-faith-received.mjs
  #   2. re-run `node scripts/import-faith-received.mjs`
  #      then `node scripts/build-faith-received.mjs`
  #   3. add or remove the matching block below
  # See memory/ghost-theme.md for the full operational guide.
  /the-faith-received/:
    template: custom-the-faith-received
  # Documents and Library aren't separate routes — they're tab-swap
  # views inside the home page, driven by the section nav rail and a
  # hash indicator (#documents / #library). See custom-the-faith-received.hbs.
  # Feature pages
  /the-faith-received/search/:
    template: custom-faith-search
  /the-faith-received/scripture/:
    template: custom-faith-scripture
  /the-faith-received/today/:
    template: custom-faith-today
