# Ghost routing for Mere Orthodoxy.
#
# Ghost treats routes.yaml as site config, not theme content, so it is
# NOT included in theme deploys (the GitHub Action zips exclude it).
# To apply this file: Ghost Admin -> Settings -> Labs -> Routes ->
# Upload routes file, then pick this file. Only needs to happen when
# routes change.

routes:
  /membership/:
    template: custom-membership
  /contributors/:
    template: custom-contributors
  /about/:
    template: custom-about
  /archive/:
    controller: channel
    template: custom-archive
    filter: status:published
  /give/:
    template: custom-gift
  /donate/:
    template: custom-donate
  /groups/:
    template: custom-groups
  /group-manage/:
    template: custom-group-manage
  /institutions/:
    template: custom-institutions
  /institution-manage/:
    template: custom-institution-manage
  /manage/:
    template: custom-manage
  /migrate/:
    template: custom-migrate
  /complete-membership/:
    template: custom-complete-membership
  /dashboard/:
    template: custom-dashboard
  /dashboard/bookmarks/:
    template: custom-dashboard-bookmarks
  /dashboard/history/:
    template: custom-dashboard-history
  /dashboard/replays/:
    template: custom-dashboard-replays
  /dashboard/ebooks/:
    template: custom-dashboard-ebooks
  /events/:
    template: custom-events
  /forum/:
    template: custom-forum
  /success/:
    template: custom-success
  /contact/:
    template: custom-contact
  /submissions/:
    template: custom-submissions
  /podcasts/mere-fidelity/:
    template: custom-mere-fidelity
  /podcasts/christians-reading-classics/:
    template: custom-christians-reading-classics
  /admin/:
    template: custom-admin
  /admin/members/:
    template: custom-admin-members
  /admin/members/addresses/:
    template: custom-admin-addresses
  /admin/members/gifts/:
    template: custom-admin-gifts
  /admin/members/groups/:
    template: custom-admin-groups
  /admin/members/institutions/:
    template: custom-admin-institutions
  /admin/members/institutions/manage/:
    template: custom-admin-institution
  /admin/members/drift/:
    template: custom-admin-drift
  /admin/settings/:
    template: custom-admin-settings
  /admin/traffic/:
    template: custom-admin-traffic
  /admin/editorial/:
    template: custom-admin-editorial
  /digest-gen/:
    template: custom-digest-gen
  # Public ebook catalog. Anonymous-viewable; tiles route through
  # the per-ebook landing pages.
  /ebooks/:
    template: custom-ebooks
  # Ebook landing pages (public, lead-gen). Form on each posts to
  # mo-ebook-access /grant which writes attribution labels and sends
  # a Ghost magic link.
  /ebook/navigating-the-fracture/:
    template: custom-ebook-navigating-the-fracture
  /ebook/spiritual-formation-for-the-family/:
    template: custom-ebook-spiritual-formation-for-the-family
  # Ebook read pages — direct template binding (no Ghost Page record).
  # Member gating is inline at the top of each template via {{#if @member}}.
  /ebook/navigating-the-fracture/read/:
    template: page-ebook-navigating-the-fracture-read
  /ebook/spiritual-formation-for-the-family/read/:
    template: page-ebook-spiritual-formation-for-the-family-read
  # Blueprint for Renewal — HIDDEN as of 2026-04-25. Editorial work
  # in progress. Re-enable by uncommenting these two routes (and
  # restoring the catalog tile in custom-ebooks.hbs and the dashboard
  # tile in partials/ebooks-list.hbs). The .hbs files stay in place.
  # /ebook/blueprint-for-renewal/:
  #   template: custom-ebook-blueprint-for-renewal
  # /ebook/blueprint-for-renewal/read/:
  #   template: page-ebook-blueprint-for-renewal-read

  # ── The Faith Received ─────────────────────────────────────────
  # Project home + 22 historic-document subpages + 5 feature pages.
  # Per-document wrapper templates are auto-generated by
  # scripts/build-faith-received.mjs from JSON sources in
  # data/faith-received/. To add or remove a document:
  #   1. add/remove the entry in scripts/import-faith-received.mjs
  #   2. re-run `node scripts/import-faith-received.mjs`
  #      then `node scripts/build-faith-received.mjs`
  #   3. add or remove the matching block below
  # See memory/ghost-theme.md for the full operational guide.
  /the-faith-received/:
    template: custom-the-faith-received
  # Documents and Library aren't separate routes — they're tab-swap
  # views inside the home page, driven by the section nav rail and a
  # hash indicator (#documents / #library). See custom-the-faith-received.hbs.
  # Feature pages
  /the-faith-received/search/:
    template: custom-faith-search
  /the-faith-received/scripture/:
    template: custom-faith-scripture
  /the-faith-received/today/:
    template: custom-faith-today
  /the-faith-received/topics/:
    template: custom-faith-topics
  /the-faith-received/topics/god-and-trinity/:
    template: custom-faith-topic-god-and-trinity
  /the-faith-received/topics/scripture-and-revelation/:
    template: custom-faith-topic-scripture-and-revelation
  /the-faith-received/topics/creation-and-providence/:
    template: custom-faith-topic-creation-and-providence
  /the-faith-received/topics/sin-and-the-fall/:
    template: custom-faith-topic-sin-and-the-fall
  /the-faith-received/topics/christ-and-the-incarnation/:
    template: custom-faith-topic-christ-and-the-incarnation
  /the-faith-received/topics/salvation-and-justification/:
    template: custom-faith-topic-salvation-and-justification
  /the-faith-received/topics/the-holy-spirit/:
    template: custom-faith-topic-the-holy-spirit
  /the-faith-received/topics/the-church/:
    template: custom-faith-topic-the-church
  /the-faith-received/topics/sacraments-and-ordinances/:
    template: custom-faith-topic-sacraments-and-ordinances
  /the-faith-received/topics/the-christian-life/:
    template: custom-faith-topic-the-christian-life
  /the-faith-received/topics/the-law-and-ethics/:
    template: custom-faith-topic-the-law-and-ethics
  /the-faith-received/topics/prayer/:
    template: custom-faith-topic-prayer
  /the-faith-received/topics/last-things/:
    template: custom-faith-topic-last-things
  /the-faith-received/devotional/:
    template: custom-faith-devotional
  # Documents (creeds, confessions, catechisms)
  /the-faith-received/apostles-creed/:
    template: custom-faith-apostles-creed
  /the-faith-received/nicene-creed/:
    template: custom-faith-nicene-creed
  /the-faith-received/chalcedonian/:
    template: custom-faith-chalcedonian
  /the-faith-received/athanasian/:
    template: custom-faith-athanasian
  /the-faith-received/didache/:
    template: custom-faith-didache
  /the-faith-received/heidelberg/:
    template: custom-faith-heidelberg
  /the-faith-received/heidelberg/memorize/:
    template: custom-faith-heidelberg-memorize
  /the-faith-received/augsburg/:
    template: custom-faith-augsburg
  /the-faith-received/belgic/:
    template: custom-faith-belgic
  /the-faith-received/thirty-nine-articles/:
    template: custom-faith-thirty-nine-articles
  /the-faith-received/1689/:
    template: custom-faith-1689
  /the-faith-received/westminster-shorter/:
    template: custom-faith-westminster-shorter
  /the-faith-received/westminster-shorter/memorize/:
    template: custom-faith-westminster-shorter-memorize
  /the-faith-received/westminster-larger/:
    template: custom-faith-westminster-larger
  /the-faith-received/westminster-larger/memorize/:
    template: custom-faith-westminster-larger-memorize
  /the-faith-received/lausanne/:
    template: custom-faith-lausanne
  # Library (classic works)
  /the-faith-received/diognetus/:
    template: custom-faith-diognetus
  /the-faith-received/ninety-five-theses/:
    template: custom-faith-ninety-five-theses
  /the-faith-received/edwards-resolutions/:
    template: custom-faith-edwards-resolutions
  /the-faith-received/athanasius-incarnation/:
    template: custom-faith-athanasius-incarnation
  /the-faith-received/augustine-confessions/:
    template: custom-faith-augustine-confessions
  /the-faith-received/calvin-institutes/:
    template: custom-faith-calvin-institutes
  /the-faith-received/charnock-attributes/:
    template: custom-faith-charnock-attributes
  /the-faith-received/imitation-of-christ/:
    template: custom-faith-imitation-of-christ
  /the-faith-received/polanus-syntagma/:
    template: custom-faith-polanus-syntagma
  /the-faith-received/rerum-novarum/:
    template: custom-faith-rerum-novarum

collections:
  /:
    permalink: /{slug}/
    template: index
    # Exclude internal-tagged event posts from the default collection
    # so they don't leak onto /archive/, tag archives, or any default
    # {{#foreach posts}} iteration. They remain accessible by URL and
    # render via the events page / replay library.
    filter: tag:-hash-event

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
